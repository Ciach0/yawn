[package]
name = "yawn-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "Benchmarks of Yawn: reactivity against dioxus-signals, result comparison, browser runs"

[dependencies]
yawn-reactivity = { path = "../crates/yawn-reactivity" }
dioxus-signals = "=0.7.10"
dioxus-core = "=0.7.10"
generational-box = "=0.7.10"
futures-util = "0.3"
dioxus-hooks = "=0.7.10"
sycamore-reactive = "=0.9.4"

[profile.release]
debug = false

# independent workspace: not a member of the root workspace (Dioxus is a heavy dependency)
[workspace]
